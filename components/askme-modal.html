<!-- ASK ABOUT ME CHAT MODAL -->
<div id="askme-overlay" onclick="closeAskMe()"></div>
<div id="askme-panel">
  <!-- Titlebar -->
  <div style="height:46px;background:rgba(32,32,44,0.99);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;border-radius:18px 18px 0 0;user-select:none;position:relative;">
    <div style="width:12px;height:12px;border-radius:50%;background:#FF5F57;cursor:pointer;" onclick="closeAskMe()"></div>
    <div style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;"></div>
    <div style="width:12px;height:12px;border-radius:50%;background:#28C840;"></div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;pointer-events:none;">
      <span style="font-size:14px">✨</span>
      <span style="font-size:13px;font-weight:700;color:#c8a0ff;letter-spacing:-0.01em;">Ask About Me</span>
      <span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:rgba(191,90,242,0.2);color:#c8a0ff;border:1px solid rgba(191,90,242,0.4)">AI Assistant</span>
    </div>
  </div>
  <!-- Messages -->
  <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:20px 20px 10px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;"></div>
  <!-- Suggestions -->
  <div id="chat-suggestions" style="padding:0 20px 12px;display:flex;flex-wrap:wrap;gap:6px;"></div>
  <!-- Input -->
  <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:10px;align-items:center;flex-shrink:0;">
    <input id="chat-input" type="text" placeholder="Ask about Prajwal..." autocomplete="off"
      style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;font-size:13px;color:#fff;font-family:inherit;outline:none;transition:border-color 0.15s;"
      onkeydown="if(event.key==='Enter')sendMsg()"
      onfocus="this.style.borderColor='rgba(191,90,242,0.6)'"
      onblur="this.style.borderColor='rgba(255,255,255,0.12)'"/>
    <button onclick="sendMsg()" style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#bf5af2,#9b27d4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:opacity 0.15s;" onmouseenter="this.style.opacity=0.85" onmouseleave="this.style.opacity=1">↑</button>
  </div>
</div>
